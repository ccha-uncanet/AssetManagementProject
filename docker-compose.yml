services:
  backend:
    build: ./backend
    container_name: asset-backend
    ports:
      - "5000:5000"
    env_file:
      - ./backend/.env
    volumes:
      - ./backend/uploads:/app/uploads
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: always

  frontend:
    build: ./frontend
    container_name: asset-frontend
    ports:
      - "80:80"
    depends_on:
      - backend
    restart: always

  cloudflared:
    image: cloudflare/cloudflared:latest
    container_name: asset-cloudflared
    restart: always
    command: tunnel --no-autoupdate --url http://localhost:80
    network_mode: host